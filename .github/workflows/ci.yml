name: Verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  installed-javascript:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
        react: ['18.3.1', '19.3.1']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node scripts/verify-js-consumer.mjs
        env:
          REACT_VERSION: ${{ matrix.react }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-js-node-${{ matrix.node }}-react-${{ matrix.react }}
          path: artifacts/js-consumer/
          retention-days: 14
  javascript:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run demo:build
      - run: git diff --exit-code -- src/generated dist
  kotlin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;37.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :library:jvmTest :library:testAndroidHostTest
        working-directory: kotlin
      - run: node scripts/ci-ios-simulator.mjs
      - run: ./gradlew :library:iosSimulatorArm64Test --device "$SIMULATOR_UDID"
        working-directory: kotlin
      - run: ./kotlin/gradlew -p examples/compose jvmTest linkDebugFrameworkIosSimulatorArm64
      - run: ./kotlin/gradlew -p examples/android assembleDebug
      - run: node scripts/verify-source-consumer.mjs "$PUBLIC_SOURCE_PIN" "$SIMULATOR_UDID"
        env:
          PUBLIC_SOURCE_PIN: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kotlin-execution-and-rendering
          path: |
            kotlin/library/build/test-results/
            kotlin/library/build/reports/rendering/
            artifacts/source-consumer/
          retention-days: 14
      - name: Remove owned simulator
        if: always() && env.SIMULATOR_UDID != ''
        run: |
          xcrun simctl shutdown "$SIMULATOR_UDID" || true
          xcrun simctl delete "$SIMULATOR_UDID"
