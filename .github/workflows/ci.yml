name: Verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  javascript:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run demo:build
      - run: git diff --exit-code -- src/generated dist
  kotlin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;37.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :library:jvmTest :library:testAndroidHostTest
        working-directory: kotlin
      - run: node scripts/ci-ios-simulator.mjs
      - run: ./gradlew :library:iosSimulatorArm64Test --device "$SIMULATOR_UDID"
        working-directory: kotlin
      - run: ./kotlin/gradlew -p examples/compose jvmTest linkDebugFrameworkIosSimulatorArm64
      - run: ./kotlin/gradlew -p examples/android assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kotlin-execution-and-rendering
          path: |
            kotlin/library/build/test-results/
            kotlin/library/build/reports/rendering/
          retention-days: 14
      - name: Remove owned simulator
        if: always() && env.SIMULATOR_UDID != ''
        run: |
          xcrun simctl shutdown "$SIMULATOR_UDID" || true
          xcrun simctl delete "$SIMULATOR_UDID"
